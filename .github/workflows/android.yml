
      - name: Corregir compatibilidad Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/RespuestasIA/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures {"
          config = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if marker not in s:
                  raise SystemExit("No se encontró el bloque buildFeatures")
              s = s.replace(marker, config + marker, 1)
              p.write_text(s)
          PY
          
name: Generar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'RespuestasIA_proyecto.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -q RespuestasIA_proyecto.zip -d source

      - name: Compilar APK
        run: gradle -p source/RespuestasIA assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RespuestasIA-APK
          path: source/RespuestasIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

        
